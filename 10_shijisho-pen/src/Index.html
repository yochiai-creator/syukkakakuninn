  :root{
    --ink:#16181d;
    --paper:#e8e6e0;
    --panel:#f7f6f3;
    --stamp:#d8352a; --line:#c9c6bd;
    --accent:#0b6b5e;
    --shadow:0 1px 3px rgba(20,22,26,.16), 0 8px 24px rgba(20,22,26,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size:15px; overflow:hidden; touch-action:none;
    display:flex; flex-direction:column;

    /* 紙の上で書くと「調べる/翻訳/検索」の選択メニューが出るのを止める。
       長押しの呼び出しと文字選択、タップ時の灰色の反応を切る。 */
    -webkit-touch-callout:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  /* 検索欄だけは文字を選べないと困るので戻す */
  input, textarea{
    -webkit-touch-callout:default;
    -webkit-user-select:text; user-select:text;
  }

  /* ---------- toolbar ---------- */
  /* 上は ファイルと保存だけ。書き込みの道具は下の tray に置く。
     手に持ったまま届く位置に道具があった方が使いやすく、
     上に詰め込むと横に溢れて隠れてしまうため。 */
  #bar{
    flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    padding:8px 10px; padding-top:max(8px, env(safe-area-inset-top));
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  #barSave{
    margin-left:auto; display:flex; align-items:center; gap:6px;
  }

  /* 下の道具棚。横に溢れたらスクロールではなく折り返す。
     スクロールだと見えていないボタンに気づけない。 */
  #tray{
    flex:0 0 auto;
    display:flex; flex-wrap:wrap; align-items:center;
    justify-content:center; gap:6px;
    padding:8px 10px;
    padding-bottom:max(8px, env(safe-area-inset-bottom));
    background:var(--panel); border-top:1px solid var(--line);
  }
  #tray .sep{display:none;}
  .grp{display:flex; align-items:center; gap:4px; padding:3px;
       border-radius:9px; background:#ece9e3; flex:0 0 auto;}
  button{
    font:inherit; font-size:14px; border:0; background:transparent; color:var(--ink);
    padding:8px 12px; border-radius:7px; cursor:pointer; min-height:40px; white-space:nowrap;
  }
  button:active{background:#dcd8d0;}
  button.on{background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.14); font-weight:600;}
  button:disabled{opacity:.35;}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .solid{background:var(--accent); color:#fff;}
  .solid:active{background:#095349;}
  .swatch{width:30px; height:30px; min-height:30px; padding:0; border-radius:50%;
          border:2px solid transparent;}
  .swatch.on{border-color:var(--ink); box-shadow:none; background:transparent;}
  .size{width:34px; height:34px; min-height:34px; padding:0; display:grid; place-items:center;}
  .size i{display:block; border-radius:50%; background:var(--ink);}
  .sep{width:1px; height:26px; background:var(--line); flex:0 0 auto;}
  #pageLbl{font-variant-numeric:tabular-nums; padding:0 6px; font-size:14px;}
  #zoomLbl{font-variant-numeric:tabular-nums; min-width:58px;}
  #photo.has{background:#e8f1ec; color:#0b6b5d; font-weight:600;}
  #stamps button{color:var(--stamp); font-weight:600; padding:8px 10px;}
  #stamps button.on{background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.14);}
  #dirty{color:#b25000; font-size:13px; padding:0 2px; display:none;}
  #dirty.show{display:inline;}

  /* ---------- stage ---------- */
  #stage{
    flex:1 1 auto; position:relative; overflow:auto;
    display:flex; padding:14px;
    -webkit-overflow-scrolling:touch;
  }
  #sheet{position:relative; background:#fff; box-shadow:var(--shadow); flex:0 0 auto; margin:auto;}
  #sheet canvas{position:absolute; inset:0; display:block; width:100%; height:100%;}
  #pdfLayer{position:relative !important;}
  #inkLayer{touch-action:none;}

  #hint{position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center;}
  #hint div{max-width:26em; line-height:1.7;}
  #hint h1{font-size:20px; font-weight:600; margin:0 0 8px;}
  #hint p{margin:0 0 18px; color:#5c5f66;}

  /* ---------- file drawer ---------- */
  #scrim{position:fixed; inset:0; background:rgba(20,22,26,.4); z-index:20; display:none;}
  #scrim.show{display:block;}
  #drawer{
    position:fixed; top:0; left:0; bottom:0; width:min(420px, 88vw);
    background:var(--panel); border-right:1px solid var(--line); z-index:30;
    transform:translateX(-100%); transition:transform .22s ease;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }
  #drawer.show{transform:translateX(0);}
  #drawerTop{padding:14px 16px 10px; border-bottom:1px solid var(--line);}
  #drawerTop h2{margin:0 0 3px; font-size:17px; font-weight:600;}
  #folderName{margin:0; font-size:13px; color:#5c5f66;}
  #crumb{margin:6px 0 0; font-size:12px; color:#5c5f66; line-height:1.6; word-break:break-all;}
  #crumb .cl{color:#1558b0; cursor:pointer; text-decoration:underline;}
  #crumb .sep{opacity:.5; padding:0 2px;}
  .row.dir b{color:#8a6d1f;}
  #search{
    width:100%; margin-top:10px; padding:9px 11px; font:inherit; font-size:14px;
    border:1px solid var(--line); border-radius:8px; background:#fff;
  }
  #files{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .row{padding:12px 16px; border-bottom:1px solid #e2dfd8; cursor:pointer; line-height:1.45;}
  .row:active{background:#e6e3dc;}
  .row.cur{background:#dfe9e6; box-shadow:inset 3px 0 0 var(--accent);}
  .row b{display:block; font-weight:500; font-size:14px; word-break:break-all;}
  .row span{font-size:12px; color:#6b6e75;}
  #drawerBot{padding:12px 16px; border-top:1px solid var(--line);
             padding-bottom:max(12px, env(safe-area-inset-bottom));}
  .msg{padding:18px 16px; color:#6b6e75; font-size:14px; line-height:1.7;}

  /* 確認ダイアログ。confirm() は別オリジンの埋め込み枠では
     ブロックされて即 false が返るため、画面内に作る。 */
  #ask{position:fixed; inset:0; z-index:40; display:grid; place-items:center;
       background:rgba(20,22,26,.45); padding:20px;}
  #ask[hidden]{display:none;}
  .askBox{background:var(--panel); border-radius:14px; padding:20px;
          max-width:min(460px, 100%); box-shadow:0 12px 40px rgba(0,0,0,.3);}
  #askMsg{margin:0 0 18px; font-size:15px; line-height:1.7; white-space:pre-line;}
  .askRow{display:flex; gap:8px; justify-content:flex-end;}
  .askRow button{min-width:88px;}

  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 17px; border-radius:8px;
    font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s;
    z-index:50; max-width:80vw; text-align:center;
  }
  #toast.show{opacity:1;}
</style>
</head>
<body>

<div id="bar">
  <button id="browse" class="solid">ファイル</button>

  <div class="grp">
    <button id="prev" disabled>&lsaquo;</button>
    <span id="pageLbl">— / —</span>
    <button id="next" disabled>&rsaquo;</button>
  </div>

  <div class="grp">
    <button id="zoomOut" disabled>&minus;</button>
    <button id="zoomLbl" disabled title="タップで全体表示に戻す">100%</button>
    <button id="zoomIn" disabled>&plus;</button>
  </div>

  <div id="barSave">
    <span id="dirty">未保存</span>
    <button id="photo" disabled>写真</button>
    <input id="photoInput" type="file" accept="image/*" multiple hidden>
    <button id="saveCopy" disabled>別名</button>
    <button id="saveOver" disabled>上書き</button>
    <button id="saveDone" class="solid" disabled>チェック完了</button>
  </div>
</div>

<div id="stage">
  <div id="hint">
    <div>
      <h1>指図書に直接書き込む</h1>
      <p>左上の「ファイル」から指図書を選んで、Apple Pencilで書き込みます。保存すると共有ドライブに戻ります。</p>
      <button id="browse2" class="solid">ファイルを選ぶ</button>
    </div>
  </div>
  <div id="sheet" hidden>
    <canvas id="pdfLayer"></canvas>
    <canvas id="inkLayer"></canvas>
  </div>
</div>

<div id="scrim"></div>
<aside id="drawer">
  <div id="drawerTop">
    <h2>指図書を開く</h2>
    <p id="folderName">フォルダを読み込み中…</p>
    <div id="crumb"></div>
    <input id="search" type="search" placeholder="依頼No.や出荷先で絞り込む" autocomplete="off">
  </div>
  <div id="files"><p class="msg">読み込み中…</p></div>
  <div id="drawerBot">
    <button id="goUp" disabled>&lsaquo; ひとつ上へ</button>
  </div>
</aside>

<div id="tray">
<div class="grp" id="tools">
    <button data-tool="pen" class="on">ペン</button>
    <button data-tool="check">レ点</button>
    <button data-tool="erase">消しゴム</button>
  </div>

  <div class="grp" id="colors">
    <button class="swatch on" data-color="#d32f2f" style="background:#d32f2f"></button>
    <button class="swatch" data-color="#16181d" style="background:#16181d"></button>
    <button class="swatch" data-color="#1565c0" style="background:#1565c0"></button>
  </div>

  <div class="grp" id="stamps">
    <button data-stamp="前田">前田</button>
    <button data-stamp="森">森</button>
    <button data-stamp="落合">落合</button>
  </div>

  <div class="grp" id="sizes">
    <button class="size" data-size="1.2"><i style="width:4px;height:4px"></i></button>
    <button class="size on" data-size="2.2"><i style="width:7px;height:7px"></i></button>
    <button class="size" data-size="4"><i style="width:11px;height:11px"></i></button>
  </div>

  <div class="sep"></div>
  <button id="undo" disabled>戻す</button>
  <button id="clear" disabled>ページ消去</button>

</div>

<div id="ask" hidden>
  <div class="askBox">
    <p id="askMsg"></p>
    <div class="askRow">
      <button id="askNo">やめる</button>
      <button id="askExtra" hidden></button>
      <button id="askYes" class="solid">はい</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

var $ = function(s){ return document.querySelector(s); };
var stage=$("#stage"), sheet=$("#sheet"), hint=$("#hint");
var pdfCv=$("#pdfLayer"), inkCv=$("#inkLayer");
var pdfCtx=pdfCv.getContext("2d"), inkCtx=inkCv.getContext("2d");

var srcBytes=null, pdfDoc=null, curFile=null;
var pageNo=1, pageCount=0, marks={}, dirty=false;
var view={w:0,h:0,dpr:1};
var zoom=1, fitScale=1;
var MIN_ZOOM=1, MAX_ZOOM=6;
var tool="pen", color="#d32f2f", size=2.2;
var STAMP_COLOR="#d8352a";   // 朱色
var STAMP_FONT="'StampEdo','Hiragino Mincho ProN','Yu Mincho',serif";  // 江戸文字

/* 埋め込みフォントも読み込みは非同期。読めたら描き直す */
if(document.fonts && document.fonts.load){
  document.fonts.load("40px 'StampEdo'", "前田森落合0123456789.").then(function(){
    if(pdfDoc) redraw();
  }).catch(function(){});
}
var penSeen=false, drawing=null;

/* ペンが紙に触れている間と、離してすぐの間は true。
   このあいだに来た指の接触は手のひらとみなし、拡大縮小に使わない。 */
var penDown=false, penUpAt=0, PALM_GRACE_MS=700;
function penBusy(){ return penDown || (Date.now()-penUpAt) < PALM_GRACE_MS; }

/* キャンバスの画素数に上限を設ける。
   iPad の Safari は1枚あたり約1,670万画素までしか扱えず、超えると
   描画が極端に遅くなるか、何も出なくなる。拡大すると
   (紙の幅×倍率×画素密度)² で増えるので、3倍でもう超える。
   上限を超えるときは画素密度の方を下げる。見た目は少し甘くなるが、
   ペンの追従を優先する。 */
var MAX_CANVAS_PIXELS = 12000000;
function canvasDpr(w, h){
  var dpr=Math.min(window.devicePixelRatio||1, 3);
  var cap=Math.sqrt(MAX_CANVAS_PIXELS/(w*h));
  return Math.max(0.5, Math.min(dpr, cap));
}

/* ---------- toast ---------- */
var toastT;
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); }, 2400);
}

/* ---------- toolbar ---------- */
/* ---------- 確認ダイアログ ---------- */
/* confirm() は使えない。別オリジンの埋め込み枠で動くため、
   ブラウザがブロックして即 false を返す(押しても何も起きない)。 */
var askFn=null, askExtraFn=null;

/* opts: {yes:"はい", extra:{label, fn}} */
function ask(msg, onYes, opts){
  opts = opts || {};
  $("#askMsg").textContent = msg;
  $("#askYes").textContent = opts.yes || "はい";

  var ex = $("#askExtra");
  if(opts.extra){
    ex.textContent = opts.extra.label;
    ex.hidden = false;
    askExtraFn = opts.extra.fn;
  } else {
    ex.hidden = true;
    askExtraFn = null;
  }

  $("#ask").hidden = false;
  askFn = onYes;
}
function closeAsk(){ $("#ask").hidden = true; askFn=null; askExtraFn=null; }
$("#askYes").onclick   = function(){ var f=askFn;      closeAsk(); if(f) f(); };
$("#askExtra").onclick = function(){ var f=askExtraFn; closeAsk(); if(f) f(); };
$("#askNo").onclick    = function(){ closeAsk(); };

function group(sel, attr, fn){
  document.querySelectorAll(sel+" button").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(sel+" button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on"); fn(b.dataset[attr]);
    });
  });
}
group("#tools","tool", function(v){
  tool=v;
  document.querySelectorAll("#stamps button").forEach(function(b){ b.classList.remove("on"); });
});

/* ハンコ。名前を押すとその印が選ばれ、紙を押した場所に捺される。
   ペンなどに戻すときは道具のボタンを押す。 */
var stampName="前田";
document.querySelectorAll("#stamps button").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll("#stamps button").forEach(function(x){ x.classList.remove("on"); });
    document.querySelectorAll("#tools button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    tool="stamp";
    stampName=b.dataset.stamp;
  });
});
group("#colors","color", function(v){ color=v; });
group("#sizes","size", function(v){ size=parseFloat(v); });

$("#prev").onclick = function(){ gotoPage(pageNo-1); };
$("#next").onclick = function(){ gotoPage(pageNo+1); };
$("#undo").onclick = function(){
  var a=marks[pageNo];
  if(a && a.length){ a.pop(); setDirty(true); redraw(); }
};
$("#clear").onclick = function(){
  if(!(marks[pageNo]||[]).length) return;
  ask("このページの書き込みをすべて消しますか?", function(){
    marks[pageNo]=[]; setDirty(true); redraw();
  });
};
$("#saveOver").onclick = function(){ save("overwrite"); };
$("#saveCopy").onclick = function(){ save("copy"); };
$("#saveDone").onclick = function(){
  if(!curFile) return;
  var photoLine = photos.length
    ? "現品の写真 " + photos.length + " 枚を末尾に追加します。\n\n"
    : "現品の写真はまだありません。\n\n";

  ask(photoLine + "チェック完了として ◆チェック完了 に保存します。\n\n保存後、元の "
    + curFile.name + " はゴミ箱へ移動します。\n(30日間は Drive のゴミ箱から戻せます)",
    function(){ save("done"); },
    photos.length ? null : { yes:"写真なしで保存", extra:{ label:"写真を撮る", fn:function(){
        $("#photoInput").click();
    }}});
};

function setDirty(v){
  dirty=v;
  $("#dirty").classList.toggle("show", v);
}
window.addEventListener("beforeunload", function(e){
  if(dirty){ e.preventDefault(); e.returnValue=""; }
});

/* ---------- drawer ---------- */
var drawer=$("#drawer"), scrim=$("#scrim");
function openDrawer(){ drawer.classList.add("show"); scrim.classList.add("show"); }
function closeDrawer(){ drawer.classList.remove("show"); scrim.classList.remove("show"); }
$("#browse").onclick = $("#browse2").onclick = openDrawer;
scrim.onclick = closeDrawer;

var curFolder=null, searchT=null;

function fileRow(f){
  var d=document.createElement("div");
  d.className="row" + (curFile && curFile.id===f.id ? " cur" : "");
  d.dataset.id=f.id;
  var b=document.createElement("b"); b.textContent=f.name;
  var s=document.createElement("span");
  s.textContent = new Date(f.modified).toLocaleString("ja-JP",
    {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"})
    + " \u00b7 " + Math.round(f.size/1024) + " KB";
  d.appendChild(b); d.appendChild(s);
  d.onclick = function(){ openFile(f); };
  return d;
}

function dirRow(f){
  var d=document.createElement("div");
  d.className="row dir";
  var b=document.createElement("b"); b.textContent="\ud83d\udcc1 "+f.name;
  var s=document.createElement("span"); s.textContent="フォルダ";
  d.appendChild(b); d.appendChild(s);
  d.onclick = function(){ openFolder(f.id); };
  return d;
}

function renderCrumb(data){
  var c=$("#crumb"); c.innerHTML="";
  data.breadcrumb.forEach(function(b,i){
    if(i){ var sp=document.createElement("span"); sp.className="sep"; sp.textContent="\u203a"; c.appendChild(sp); }
    var a=document.createElement("span");
    a.textContent=b.name;
    if(i < data.breadcrumb.length-1){ a.className="cl"; a.onclick=function(){ openFolder(b.id); }; }
    c.appendChild(a);
  });
}

function renderFolder(data){
  curFolder=data;
  renderCrumb(data);
  $("#goUp").disabled = !!data.isRoot;
  var box=$("#files"); box.innerHTML="";
  if(!data.folders.length && !data.files.length){
    box.innerHTML='<p class="msg">このフォルダは空です。</p>'; return;
  }
  data.folders.forEach(function(f){ box.appendChild(dirRow(f)); });
  data.files.forEach(function(f){ box.appendChild(fileRow(f)); });
}

function openFolder(id){
  $("#files").innerHTML='<p class="msg">読み込み中…</p>';
  google.script.run
    .withSuccessHandler(renderFolder)
    .withFailureHandler(function(err){
      $("#files").innerHTML='<p class="msg">フォルダを開けませんでした。<br>'+err.message+'</p>';
    })
    .listFolder(id||"");
}

function refreshFiles(){ openFolder(curFolder ? curFolder.id : ""); }

/* 開いているファイルの行にだけ印を付ける(一覧は取り直さない) */
function markCurrent(){
  document.querySelectorAll("#files .row").forEach(function(r){
    r.classList.toggle("cur", !!curFile && r.dataset.id===curFile.id);
  });
}

function runSearch(k){
  $("#goUp").disabled = true;
  $("#files").innerHTML='<p class="msg">検索中…</p>';
  $("#crumb").textContent='"'+k+'" を配下すべてから検索';
  google.script.run
    .withSuccessHandler(function(list){
      var box=$("#files"); box.innerHTML="";
      if(!list.length){ box.innerHTML='<p class="msg">見つかりませんでした。</p>'; return; }
      list.forEach(function(f){ box.appendChild(fileRow(f)); });
    })
    .withFailureHandler(function(err){
      $("#files").innerHTML='<p class="msg">検索できませんでした。<br>'+err.message+'</p>';
    })
    .searchPdfs(k);
}

$("#search").addEventListener("input", function(e){
  var k=e.target.value.trim();
  clearTimeout(searchT);
  if(!k){ refreshFiles(); return; }
  searchT=setTimeout(function(){ runSearch(k); }, 400);
});

function refreshFolder(){
  google.script.run
    .withSuccessHandler(function(info){ $("#folderName").textContent=info.name; })
    .withFailureHandler(function(){ $("#folderName").textContent="フォルダを開けません"; })
    .getFolderInfo();
}

/* ひとつ上のフォルダへ。パンくずの1つ手前がその親。
   ルートにいるときは押せない。 */
$("#goUp").onclick = function(){
  if(!curFolder || curFolder.isRoot) return;
  var b = curFolder.breadcrumb || [];
  openFolder(b.length >= 2 ? b[b.length-2].id : "");
};

refreshFolder();
openFolder("");

/* ---------- open ---------- */
function b64ToBytes(b64){
  var bin=atob(b64), len=bin.length, out=new Uint8Array(len);
  for(var i=0;i<len;i++) out[i]=bin.charCodeAt(i);
  return out;
}

function openFile(f){
  if(dirty){
    ask("未保存の書き込みがあります。\n破棄して別のファイルを開きますか?",
        function(){ doOpenFile(f); });
    return;
  }
  doOpenFile(f);
}

function doOpenFile(f){
  closeDrawer();
  toast("読み込み中…");
  google.script.run
    .withSuccessHandler(function(res){ mountPdf(res); })
    .withFailureHandler(function(err){ toast("開けませんでした: "+err.message); })
    .loadPdf(f.id);
}

function mountPdf(res){
  curFile={id:res.id, name:res.name};
  srcBytes=b64ToBytes(res.data);
  marks={}; pageNo=1; setDirty(false); penSeen=false; zoom=1;
  clearPhotos();

  pdfjsLib.getDocument({data: srcBytes.slice()}).promise.then(function(doc){
    pdfDoc=doc; pageCount=doc.numPages;
    hint.hidden=true; sheet.hidden=false;
    ["prev","next","undo","clear","saveOver","saveCopy","saveDone","zoomIn","zoomOut","zoomLbl","photo"].forEach(function(id){
      $("#"+id).disabled=false;
    });
    return renderPage();
  }).then(function(){
    updateNav();
    updateZoomLbl();
    markCurrent();
    toast(curFile.name);
  }).catch(function(err){
    console.error(err);
    toast("PDFを表示できませんでした");
  });
}

/* ---------- render ---------- */
function renderPage(){
  return pdfDoc.getPage(pageNo).then(function(page){
    var un=page.getViewport({scale:1});
    var availW=stage.clientWidth-28, availH=stage.clientHeight-28;
    fitScale=Math.min(availW/un.width, availH/un.height);
    var vp=page.getViewport({scale: fitScale*zoom});
    var dpr=canvasDpr(vp.width, vp.height);
    view={w:vp.width, h:vp.height, dpr:dpr};

    sheet.style.width=vp.width+"px";
    sheet.style.height=vp.height+"px";
    [pdfCv, inkCv].forEach(function(cv){
      cv.width=Math.round(vp.width*dpr);
      cv.height=Math.round(vp.height*dpr);
      cv.style.width=vp.width+"px";
      cv.style.height=vp.height+"px";
    });
    pdfCtx.setTransform(dpr,0,0,dpr,0,0);
    return page.render({canvasContext:pdfCtx, viewport:vp}).promise;
  }).then(redraw);
}

function updateNav(){
  $("#pageLbl").textContent = pageCount ? pageNo+" / "+pageCount : "— / —";
  $("#prev").disabled = pageNo<=1;
  $("#next").disabled = pageNo>=pageCount;
}
function gotoPage(n){
  if(n<1 || n>pageCount) return;
  pageNo=n; renderPage().then(updateNav);
}

/* ---------- 拡大縮小 ---------- */
function updateZoomLbl(){
  $("#zoomLbl").textContent = Math.round(zoom*100)+"%";
  $("#zoomIn").disabled  = !pdfDoc || zoom >= MAX_ZOOM-0.001;
  $("#zoomOut").disabled = !pdfDoc || zoom <= MIN_ZOOM+0.001;
}

/**
 * 拡大率を変える。cx,cy はステージ左上から見た「動かしたくない点」。
 * 省略時は画面中央を保つ。
 */
function applyZoom(z, cx, cy){
  if(!pdfDoc) return Promise.resolve();
  z = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
  if(Math.abs(z-zoom) < 0.005){ updateZoomLbl(); return Promise.resolve(); }

  var prev = zoom;
  zoom = z;
  if(cx == null){ cx = stage.clientWidth/2; cy = stage.clientHeight/2; }

  return renderPage().then(function(){
    var r = zoom/prev;
    stage.scrollLeft = (stage.scrollLeft + cx) * r - cx;
    stage.scrollTop  = (stage.scrollTop  + cy) * r - cy;
    updateZoomLbl();
  });
}

$("#zoomIn").onclick  = function(){ applyZoom(zoom*1.25); };
$("#zoomOut").onclick = function(){ applyZoom(zoom/1.25); };
$("#zoomLbl").onclick = function(){ applyZoom(1); };

/* 2本指でつまむと拡大縮小、そのまま動かすと移動。
   1本指とペンは描画に使うので触らない。

   指を動かしている間は CSS の変形で追従させるだけにして、PDF の
   再描画は指を離したときに一度だけ行う。動かすたびに再描画すると
   キャンバスのリサイズとスクロール補正が重なって画面が震える。
   変形中は少しぼやけるが、離した時点で綺麗に描き直される。 */
var touches={}, pinch=null;

/* 1本目の指が触れた時点の状態。2本目が来てピンチと分かったら
   ここまで巻き戻す。ペン未使用のときは指でも描けるため、
   つまもうとしただけで1本目が線を引いてしまう。 */
var fingerStart=null;

function tdist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
function touchIds(){ return Object.keys(touches).slice(0,2); }

stage.addEventListener("pointerdown", function(e){
  if(e.pointerType!=="touch" || !pdfDoc) return;
  // ペンで書いている最中に触れたものは手のひら。数に入れない。
  if(penBusy()) return;
  touches[e.pointerId]={x:e.clientX, y:e.clientY};

  var ids=touchIds();
  if(ids.length===1){
    fingerStart={ page:pageNo, len:(marks[pageNo]||[]).length, dirty:dirty };
  }
  if(ids.length===2 && !pinch){
    var a=touches[ids[0]], b=touches[ids[1]];
    var mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    var r=stage.getBoundingClientRect();

    // つまみ始めに指の下にあった紙の上の点。これを指に追従させる。
    pinch={
      d:  tdist(a,b)||1,
      z:  zoom,
      mx: mx, my: my,          // つまみ始めの中点
      cx: mx, cy: my,          // 今の中点(確定時の基準)
      px: (stage.scrollLeft + mx - r.left) - sheet.offsetLeft,
      py: (stage.scrollTop  + my - r.top ) - sheet.offsetTop,
      k:  1
    };

    sheet.style.transformOrigin="0 0";
    sheet.style.willChange="transform";

    // つまもうとしただけなので、1本目の指が触れて以降に指で書いたものを
    // すべて取り消す。直前の1本だけ消すと、1本目が引いた線が残る。
    // ペンで書いたものは消さない(手のひらでここに来ることがあるため)。
    if(drawing && drawing.by==="touch") drawing=null;
    if(fingerStart){
      var list=marks[fingerStart.page];
      if(list && list.length > fingerStart.len){
        var kept=list.filter(function(m, i){ return i < fingerStart.len || m.by!=="touch"; });
        if(kept.length !== list.length){
          marks[fingerStart.page]=kept;
          if(kept.length === fingerStart.len) setDirty(fingerStart.dirty);
          if(fingerStart.page===pageNo) redraw();
        }
      }
    }
  }
}, {passive:false, capture:true});
/* capture にして、紙の上の処理(線を足す)より先にここを通す。
   後だと、1本目の指が引き始めた線がもう数に入ってしまい、
   ピンチと分かっても取り消せない。2本目の指も、先に pinch が
   立つので線を引き始めない。 */

stage.addEventListener("pointermove", function(e){
  if(e.pointerType!=="touch" || !(e.pointerId in touches)) return;
  touches[e.pointerId]={x:e.clientX, y:e.clientY};
  if(!pinch) return;

  var ids=touchIds();
  if(ids.length<2) return;
  e.preventDefault();

  var a=touches[ids[0]], b=touches[ids[1]];
  var mx=(a.x+b.x)/2, my=(a.y+b.y)/2;

  // 拡大率は全体表示〜600%の範囲に収める
  var k = tdist(a,b)/pinch.d;
  k = Math.max(MIN_ZOOM/pinch.z, Math.min(MAX_ZOOM/pinch.z, k));
  pinch.k = k;

  // つまみ始めの点が今の指の位置に来るように寄せる。
  // スクロールは触らない(端で止まって指とずれるため)。
  var tx = (mx - pinch.mx) + (1-k)*pinch.px;
  var ty = (my - pinch.my) + (1-k)*pinch.py;

  pinch.cx = mx; pinch.cy = my;

  sheet.style.transform = "translate("+tx+"px,"+ty+"px) scale("+k+")";
  $("#zoomLbl").textContent = Math.round(pinch.z*k*100)+"%";
}, {passive:false});

/* 指を離したら、変形をやめて実際の倍率で描き直す */
function commitPinch(){
  var p=pinch; pinch=null;
  if(!p) return;

  // 基準は最後の「2本の中点」。ここで残った指の位置を使うと、
  // 中点との差ぶん(数十px)だけ画面が飛ぶ。
  var mx = p.cx, my = p.cy;

  sheet.style.transform="";
  sheet.style.willChange="";

  var next = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, p.z*p.k));
  if(Math.abs(next-p.z) < 0.005){ updateZoomLbl(); return; }

  var ratio = next/p.z;
  zoom = next;

  renderPage().then(function(){
    // 描き直すと紙の位置(margin:auto ぶん)が変わるので取り直して合わせる
    var r=stage.getBoundingClientRect();
    stage.scrollLeft = sheet.offsetLeft + p.px*ratio - (mx - r.left);
    stage.scrollTop  = sheet.offsetTop  + p.py*ratio - (my - r.top);
    updateZoomLbl();
  });
}

function endTouch(e){
  if(e.pointerType!=="touch") return;
  delete touches[e.pointerId];
  if(pinch && Object.keys(touches).length<2) commitPinch();
  if(!Object.keys(touches).length) fingerStart=null;
}
stage.addEventListener("pointerup", endTouch);
stage.addEventListener("pointercancel", endTouch);

/* ---------- ink ---------- */
function paint(ctx, m, W, H, s){
  if(m.type==="stamp"){ paintStamp(ctx, m, W, H); return; }
  ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=m.color;

  // 紙の幅に対する比率から実寸を出す。rel を持たない古い印は従来どおり
  var unit = m.rel ? m.rel*W : m.size*s;

  if(m.type==="check"){
    var u=unit*1.15;
    ctx.lineWidth=Math.max(1.4, unit*0.85);
    ctx.beginPath();
    ctx.moveTo(m.x*W - u*1.9, m.y*H - u*0.2);
    ctx.lineTo(m.x*W - u*0.5, m.y*H + u*1.5);
    ctx.lineTo(m.x*W + u*2.3, m.y*H - u*2.1);
    ctx.stroke();
    return;
  }
  var p=m.pts;
  if(p.length===1){
    ctx.fillStyle=m.color;
    ctx.beginPath();
    ctx.arc(p[0].x*W, p[0].y*H, Math.max(.6, unit*p[0].p/2), 0, 7);
    ctx.fill();
    return;
  }
  paintSegments(ctx, m, W, H, unit, 1);
}

/* 線の from 番目の点から最後までを描く。書いている最中は、
   増えたぶんだけをここで描き足す(毎回ページ全体を描き直すと、
   線や判子が増えるほど遅れてペン先に付いてこなくなる)。 */
function paintSegments(ctx, m, W, H, unit, from){
  var p=m.pts;
  ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=m.color;
  for(var i=Math.max(1, from);i<p.length;i++){
    var a=p[i-1], b=p[i];
    ctx.lineWidth=Math.max(.5, unit*(a.p+b.p)/2);
    ctx.beginPath();
    ctx.moveTo(a.x*W, a.y*H);
    ctx.lineTo(b.x*W, b.y*H);
    ctx.stroke();
  }
}

/* 書いている線の、まだ描いていないぶんだけを描く */
function paintTail(m){
  inkCtx.setTransform(view.dpr,0,0,view.dpr,0,0);
  var unit = m.rel ? m.rel*view.w : m.size;
  paintSegments(inkCtx, m, view.w, view.h, unit, m.drawn||1);
  m.drawn = m.pts.length;
}

function updateInkButtons(){
  var list=marks[pageNo]||[];
  $("#undo").disabled = !list.length;
  $("#clear").disabled = !list.length;
}

/* 日付印。丸を横線で二つに分け、上に名前、下にチェックした日を入れる。
   大きさは紙の幅に対する割合で決めるので、画面でも書き出したPDFでも
   同じ比率になる。 */
function paintStamp(ctx, m, W, H){
  var R  = W * 0.034;
  var cx = m.x*W, cy = m.y*H;

  ctx.save();
  ctx.strokeStyle = STAMP_COLOR;
  ctx.fillStyle   = STAMP_COLOR;
  ctx.textAlign   = "center";
  ctx.textBaseline= "middle";

  // 外枠
  ctx.lineWidth = Math.max(1, R*0.10);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.stroke();

  // 上下を分ける線。円の内側に収まる長さにする
  var half = R*0.93;
  ctx.lineWidth = Math.max(1, R*0.06);
  ctx.beginPath();
  ctx.moveTo(cx - half*0.62, cy);
  ctx.lineTo(cx + half*0.62, cy);
  ctx.stroke();

  // 上段: 名前 / 下段: 日付。どちらも同じ籠文字体で塗りつぶす
  drawFitted_(ctx, m.name||"", cx, cy - R*0.45, R*1.30, R*0.52);
  drawFitted_(ctx, m.date||"", cx, cy + R*0.47, R*1.40, R*0.40);

  ctx.restore();
}

/* 指定の幅に収まるまで字を小さくして中央に描く */
function drawFitted_(ctx, text, cx, cy, maxW, baseFs){
  if(!text) return;

  var fs = baseFs;
  ctx.font = fs + "px " + STAMP_FONT;
  var w = ctx.measureText(text).width;
  if(w > maxW){
    fs = fs * maxW / w;
    ctx.font = fs + "px " + STAMP_FONT;
  }
  ctx.fillText(text, cx, cy);
}

/* 捺した日。26.9.19 の形 */
function stampDate(){
  var d = new Date();
  return (d.getFullYear() % 100) + "." + (d.getMonth()+1) + "." + d.getDate();
}

function redraw(){
  inkCtx.setTransform(view.dpr,0,0,view.dpr,0,0);
  inkCtx.clearRect(0,0,view.w,view.h);
  var list=marks[pageNo]||[];
  for(var i=0;i<list.length;i++) paint(inkCtx, list[i], view.w, view.h, 1);
  if(drawing && drawing.pts) drawing.drawn = drawing.pts.length;
  updateInkButtons();
}

function pos(e){
  var r=inkCv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height};
}
/* 太さを紙の幅に対する比率で持つ。画面のピクセル数のままだと、
   拡大して書いた線が縮小したときに相対的に太くなる。

   比率は「全体表示のときの紙の幅」を基準にする。view.w は今の倍率での
   幅なので、倍率で割って全体表示のときの幅に直してから比を取る。
   こうすると、どの倍率で書いても紙の上の太さは同じになる。
   実際のペンが、近づいて見ても紙に引く線の太さは変わらないのと同じ。 */
function sizeRel(){
  var base = view.w ? view.w / (zoom || 1) : 800;   // 全体表示のときの紙の幅
  return size / base;
}

/* 筆圧で太さを少しだけ変える。
   以前は 0.45〜1.35 倍と幅が広く、軽く書くと細くかすれ、
   力の入り方で太さがばらついて書きにくかった。0.8〜1.2 倍に絞る。
   値は前の点となじませて、急に太さが跳ねないようにする。 */
var PRESSURE_MIN=0.8, PRESSURE_RANGE=0.4, PRESSURE_SMOOTH=0.35;
function pressure(e, prev){
  if(e.pointerType!=="pen") return 1;
  var raw = e.pressure>0 ? Math.min(1, e.pressure) : 0.5;
  var w = PRESSURE_MIN + raw*PRESSURE_RANGE;
  return prev ? prev + (w-prev)*PRESSURE_SMOOTH : w;
}
function hitErase(pt){
  var list=marks[pageNo]||[], R=0.016*Math.max(view.w, view.h);
  for(var i=list.length-1;i>=0;i--){
    var m=list[i];
    var pts = m.pts ? m.pts : [{x:m.x, y:m.y}];
    for(var j=0;j<pts.length;j++){
      var dx=(pts[j].x-pt.x)*view.w, dy=(pts[j].y-pt.y)*view.h;
      if(Math.sqrt(dx*dx+dy*dy) < R){ list.splice(i,1); return true; }
    }
  }
  return false;
}

inkCv.addEventListener("pointerdown", function(e){
  if(!pdfDoc) return;
  if(e.pointerType==="pen"){ penSeen=true; penDown=true; }
  if(penSeen && e.pointerType!=="pen") return;   // 手のひら・指は無視
  if(pinch) return;                               // 拡大縮小の最中は書かない
  if(e.pointerType==="mouse" && e.button!==0) return;

  e.preventDefault();
  inkCv.setPointerCapture(e.pointerId);
  var pt=pos(e);
  marks[pageNo]=marks[pageNo]||[];

  if(tool==="stamp"){
    marks[pageNo].push({type:"stamp", name:stampName, date:stampDate(), x:pt.x, y:pt.y, by:e.pointerType});
    setDirty(true); redraw(); return;
  }
  if(tool==="check"){
    marks[pageNo].push({type:"check", color:color, size:size, rel:sizeRel(), x:pt.x, y:pt.y, by:e.pointerType});
    setDirty(true); redraw(); return;
  }
  if(tool==="erase"){
    drawing={erase:true, by:e.pointerType};
    if(hitErase(pt)){ setDirty(true); redraw(); }
    return;
  }
  drawing={type:"stroke", color:color, size:size, rel:sizeRel(), by:e.pointerType,
           pts:[{x:pt.x, y:pt.y, p:pressure(e)}]};
  marks[pageNo].push(drawing);
  setDirty(true);

  // 書き始めの点だけ描く。ページ全体は描き直さない
  inkCtx.setTransform(view.dpr,0,0,view.dpr,0,0);
  paint(inkCtx, drawing, view.w, view.h, 1);
  drawing.drawn = 1;
  updateInkButtons();
}, {passive:false});

inkCv.addEventListener("pointermove", function(e){
  if(!drawing) return;
  e.preventDefault();
  var evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  if(!evts.length) evts = [e];   // まとめ取りに対応していない/空で返す環境
  if(drawing.erase){
    var hit=false;
    for(var i=0;i<evts.length;i++) if(hitErase(pos(evts[i]))) hit=true;
    if(hit) redraw();
    return;
  }
  for(var k=0;k<evts.length;k++){
    var p=pos(evts[k]);
    var last=drawing.pts[drawing.pts.length-1];
    drawing.pts.push({x:p.x, y:p.y, p:pressure(evts[k], last.p)});
  }
  paintTail(drawing);
}, {passive:false});

function endStroke(e){
  if(e && e.pointerType==="pen"){ penDown=false; penUpAt=Date.now(); }
  if(drawing && drawing.pts){ delete drawing.drawn; }
  drawing=null;
}
inkCv.addEventListener("pointerup", endStroke);
inkCv.addEventListener("pointercancel", endStroke);
inkCv.addEventListener("pointerleave", endStroke);

/* ---------- 現品写真 ---------- */
/* チェック完了のときだけ、撮った写真をPDFの末尾に足す。
   上書き保存や別名保存には入れない(元の枚数を勝手に増やさないため)。 */
var photos=[];

function updatePhotoBtn(){
  var b=$("#photo");
  b.textContent = photos.length ? "写真 "+photos.length : "写真";
  b.classList.toggle("has", photos.length>0);
}

function clearPhotos(){ photos=[]; updatePhotoBtn(); }

$("#photo").onclick = function(){
  if(!photos.length){ $("#photoInput").click(); return; }
  ask("現品の写真が "+photos.length+" 枚あります。",
      function(){ $("#photoInput").click(); },
      { yes:"追加する", extra:{ label:"全部消す", fn:function(){
          clearPhotos(); toast("写真を消しました");
      }}});
};

$("#photoInput").addEventListener("change", function(e){
  var files=Array.prototype.slice.call(e.target.files||[]);
  e.target.value="";                     // 同じ写真をもう一度選べるように
  if(!files.length) return;

  toast("写真を取り込み中…");
  var chain=Promise.resolve();
  files.forEach(function(f){
    chain = chain.then(function(){ return photoToJpeg(f); })
                 .then(function(bytes){ photos.push(bytes); });
  });
  chain.then(function(){
    updatePhotoBtn();
    toast("写真 "+photos.length+" 枚");
  }).catch(function(err){
    console.error(err);
    toast("写真を読み込めませんでした");
  });
});

/* どの形式で来ても一度キャンバスに通してJPEGに揃える。
   iPhone の HEIC でも、表示できる形式なら取り込める。
   長辺1600pxに縮めて、PDFが重くなりすぎないようにする。 */
function photoToJpeg(file){
  return new Promise(function(resolve, reject){
    var url=URL.createObjectURL(file);
    var img=new Image();

    img.onload=function(){
      var MAX=1600;
      var sc=Math.min(1, MAX/Math.max(img.width, img.height));
      var c=document.createElement("canvas");
      c.width =Math.max(1, Math.round(img.width *sc));
      c.height=Math.max(1, Math.round(img.height*sc));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);

      c.toBlob(function(blob){
        if(!blob){ reject(new Error("変換できません")); return; }
        blob.arrayBuffer().then(function(ab){ resolve(new Uint8Array(ab)); }, reject);
      }, "image/jpeg", 0.82);
    };

    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error("読み込めません")); };
    img.src=url;
  });
}

/* 写真を1枚1ページとして末尾に足す。用紙は本体の1ページ目に合わせる */
function appendPhotos(out){
  if(!photos.length) return Promise.resolve();

  var first=out.getPages()[0];
  var pw=first?first.getWidth():595.28, ph=first?first.getHeight():841.89;
  var chain=Promise.resolve();

  photos.forEach(function(bytes){
    chain=chain.then(function(){ return out.embedJpg(bytes); }).then(function(img){
      var page=out.addPage([pw, ph]);
      var m=Math.min(pw, ph)*0.05;
      var sc=Math.min((pw-m*2)/img.width, (ph-m*2)/img.height);
      var w=img.width*sc, h=img.height*sc;
      page.drawImage(img, {x:(pw-w)/2, y:(ph-h)/2, width:w, height:h});
    });
  });
  return chain;
}

/* ---------- save ---------- */
function bytesToB64(bytes){
  var out="", chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk){
    out += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(out);
}

function save(mode){
  if(!curFile) return;
  var btns=[$("#saveOver"), $("#saveCopy"), $("#saveDone")];
  var label = mode==="overwrite" ? $("#saveOver") : (mode==="done" ? $("#saveDone") : $("#saveCopy"));
  var old = label.textContent;
  btns.forEach(function(b){ b.disabled=true; });
  label.textContent="保存中…";

  buildPdf(mode==="done").then(function(bytes){
    return new Promise(function(resolve, reject){
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .savePdf({fileId: curFile.id, data: bytesToB64(bytes), mode: mode});
    });
  }).then(function(res){
    setDirty(false);
    if(res.mode==="done"){
      toast("チェック完了 " + res.folder + " へ保存、元ファイルはゴミ箱へ");
      clearPhotos();
      closeFile();
    } else {
      toast(res.mode==="overwrite" ? "上書き保存しました" : res.name+" を作成しました");
    }
    refreshFiles();
  }).catch(function(err){
    console.error(err);
    toast("保存できませんでした: " + (err.message||err));
  }).then(function(){
    btns.forEach(function(b){ b.disabled=false; });
    label.textContent=old;
  });
}

/* チェック完了で元ファイルが消えるため、開いている状態も閉じる */
function closeFile(){
  curFile=null; pdfDoc=null; srcBytes=null;
  marks={}; pageNo=1; pageCount=0; zoom=1; setDirty(false);
  sheet.hidden=true; hint.hidden=false;
  ["prev","next","undo","clear","saveOver","saveCopy","saveDone","zoomIn","zoomOut","zoomLbl","photo"].forEach(function(id){
    $("#"+id).disabled=true;
  });
}

function buildPdf(withPhotos){
  var PDFDocument = PDFLib.PDFDocument;
  // ハンコの字がフォント未読込のまま焼き込まれないように待つ
  var fontReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  return fontReady.then(function(){
    return PDFDocument.load(srcBytes.slice());
  }).then(function(out){
    var pages=out.getPages();
    var keys=Object.keys(marks).filter(function(k){ return (marks[k]||[]).length; });

    var chain=Promise.resolve();
    keys.forEach(function(key){
      chain = chain.then(function(){
        var p=pages[parseInt(key,10)-1];
        if(!p) return;
        var sz=p.getSize(), S=3;
        var off=document.createElement("canvas");
        off.width=Math.round(sz.width*S);
        off.height=Math.round(sz.height*S);
        var oc=off.getContext("2d");
        marks[key].forEach(function(m){ paint(oc, m, off.width, off.height, S); });

        return new Promise(function(res){ off.toBlob(res, "image/png"); })
          .then(function(blob){ return blob.arrayBuffer(); })
          .then(function(buf){ return out.embedPng(buf); })
          .then(function(img){
            p.drawImage(img, {x:0, y:0, width:sz.width, height:sz.height});
          });
      });
    });

    return chain
      .then(function(){ return withPhotos ? appendPhotos(out) : null; })
      .then(function(){ return out.save(); });
  });
}

/* ---------- resize ---------- */
var rt;
window.addEventListener("resize", function(){
  if(!pdfDoc) return;
  clearTimeout(rt);
  rt=setTimeout(function(){ renderPage(); }, 200);
});
</script>
